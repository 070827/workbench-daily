# 创作情报中枢 · 每日自动更新（云端定时，不依赖本地电脑）
# 每天北京时间 07:55 自动运行（UTC 23:55 前一天），也可手动触发
name: Daily Hot Update

on:
  schedule:
    - cron: '55 23 * * *'   # UTC 23:55 = 北京 07:55
  workflow_dispatch: {}     # 支持手动触发测试

permissions:
  contents: write

concurrency:
  group: daily-hot
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 配置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 缓存 puppeteer
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/puppeteer
            node_modules
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-puppeteer-

      - name: 安装 puppeteer（含 Chromium）
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install puppeteer --no-fund --no-audit

      # ---- 抓取 ----
      - name: 抓取抖音 + B站（真实平台数据）
        id: fetch
        continue-on-error: true
        run: python cloud/fetch_platform_hot.py --out data/platform_hot_raw.json

      - name: 抓取小红书（cookies 注入）
        id: xhs
        continue-on-error: true
        env:
          XHS_COOKIES: ${{ secrets.XHS_COOKIES }}
          XHS_OUT: data/xhs_hot_raw.json
        run: node cloud/xhs_fetch_cloud.js

      # ---- 生成 ----
      - name: 规则挑选生成 daily_hot.json
        id: build
        continue-on-error: true
        run: python cloud/build_daily_cloud.py

      # ---- 推送 ----
      - name: 推送早报到微信
        id: push
        continue-on-error: true
        env:
          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
        run: python cloud/push_plus_cloud.py morning

      # ---- 失败汇总推送（铁律：任何失败都必须第一时间推送）----
      - name: 推送失败提醒
        if: ${{ steps.fetch.outcome == 'failure' || steps.xhs.outcome == 'failure' || steps.build.outcome == 'failure' || steps.push.outcome == 'failure' }}
        continue-on-error: true
        env:
          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
        run: |
          python cloud/push_plus_cloud.py alert "⚠️ 早报流程有失败" "云端流程步骤状态：抓取抖音B站=${{ steps.fetch.outcome }}，小红书=${{ steps.xhs.outcome }}，生成=${{ steps.build.outcome }}，早报推送=${{ steps.push.outcome }}。请查看 GitHub Actions 运行日志定位问题。"

      # ---- 提交数据回仓库（main 分支 = GitHub Pages 线上，push 即自动更新）----
      - name: 提交数据更新
        if: ${{ always() }}
        run: |
          git config user.name "workbench-bot"
          git config user.email "workbench-bot@users.noreply.github.com"
          git add -A data/ index.html 2>/dev/null || git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "daily data update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "数据已提交，线上工作台自动更新"
          else
            echo "数据无变化，跳过提交"
          fi
